<!-- ================================================================= -->
<!-- ARCHIVO: GridComprobantes.html                                    -->
<!-- UBICACIÓN: views/components/comprobantes/                         -->
<!-- RESPONSABILIDAD: Grilla adaptativa de tarjetas de comprobantes    -->
<!-- ================================================================= -->

<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-3 md:gap-5">
  <template x-for="item in items" :key="item.hash_largo">
    <div class="bg-[#060c24] border border-[#16224f] hover:border-cyan-500/40 rounded-2xl p-3 md:p-4 shadow-xl flex flex-col justify-between gap-2.5 transition-all relative">
      
      <!-- CABECERA TARJETA (Monto, Titular, Banco, Ref) -->
      <div class="flex items-start justify-between gap-2 border-b border-blue-900/30 pb-2">
        <div class="flex items-baseline gap-1 min-w-0">
          <span class="text-xl sm:text-2xl font-black tracking-tight truncate" 
                :class="parseFloat(item.monto || item.monto_local) < 0 ? 'text-rose-400' : 'text-emerald-400'" 
                x-text="formatMonto(item.monto || item.monto_local)"></span>
          <span class="text-xs font-black text-slate-300 whitespace-nowrap" 
                x-text="item.moneda || item.moneda_local || 'COP'"></span>
        </div>
        <div class="flex flex-col items-end text-right text-[9px] md:text-[10px] font-mono leading-tight max-w-[130px] shrink-0">
          <span class="text-slate-200 font-bold uppercase truncate w-full" x-text="item.titular || 'TITULAR NO DEFINIDO'"></span>
          <span class="text-slate-400 uppercase truncate w-full" x-text="item.banco || 'BANCO'"></span>
          <span class="text-cyan-400 font-bold w-full truncate" x-text="'Ref: ' + (item.referencia || 'N/A')"></span>
        </div>
      </div>

      <!-- DETALLE DE SOCIOS -->
      <%- include('./CardSociosDetalle.html') %>

      <!-- FOOTER Y BADGES -->
      <%- include('./CardFooterBadges.html') %>

    </div>
  </template>
</div>
